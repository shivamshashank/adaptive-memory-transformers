name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.26

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Compile Python sources
        run: uv run python -m compileall -q src scripts

      - name: Check formatting
        run: uv run ruff format --check src scripts tests

      - name: Lint
        run: uv run ruff check src scripts tests

      - name: Type-check
        run: uv run mypy

      - name: Run tests
        run: uv run pytest
