[project]
name = "adaptive-memory-transformers"
version = "0.1.0"
description = "Research prototype for adaptive Transformer KV-cache retention under matched memory budgets."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [
  { name = "Shivam Shashank" },
]
dependencies = [
  "matplotlib==3.11.2",
  "torch==2.12.1",
  "transformers==5.13.0",
]

[project.scripts]
amt = "amt.cli:main"

[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pre-commit>=4.3,<5",
  "pytest>=9,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
addopts = "-ra -q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".ua", ".venv", "results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src/amt"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.setuptools.packages.find]
where = ["src"]
